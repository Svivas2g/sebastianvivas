<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SYN">
  <!-- Favicon de SYN: el chevron <> de la marca, en cuadrado.
       No usa el syn-mark.png porque ese es una banda de 221x65: al meterlo
       en la caja cuadrada de la pestana los chevrones quedan diminutos.
       Trazo grueso a proposito: a 16 px tiene que seguir leyendose.
       Colores: --negro #08080A y --syn-luz #A46BFF (el morado de iconos). -->
  <rect width="32" height="32" rx="7" fill="#08080A"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#A46BFF" stroke-opacity=".28"/>
  <g fill="none" stroke="#A46BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 8.5 6 16 12 23.5"/>
    <path d="M20 8.5 26 16 20 23.5"/>
  </g>
</svg>
